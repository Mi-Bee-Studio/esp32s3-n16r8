## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  espressif/esp32-camera: ~2.1.7
  espressif/mdns: '*'
  # espp/rtsp is vendored in components/espp__rtsp (patched: digest auth,
  # TCP interleaved, max_sessions, mbedtls REQUIRES) — do not re-add here.
  # Its former private dependencies are declared directly instead:
  espp/base_component: '*'
  espp/socket: '*'
  espp/task: '*'
  espressif/quirc: '*'
  espressif/esp-dl: ^3.3.6
  espressif/human_face_detect: '*'
  espressif/led_strip: ^2.5.0
  espressif/cjson: 1.7.19~2   # pinned 2026-09-05 (was ~1.2.1, which matches no registry version — registry only offers 1.7.19/1.7.19~1/1.7.19~2); other three repos vendor cJSON 1.7.19 in main/
